name: oit_video_call
description: OIT shared Flutter plugin wrapping Stream Video for Dharmayana apps.
version: 1.4.4
publish_to: 'none'

environment:
  sdk: '>=3.8.0 <4.0.0'
  flutter: '>=3.24.0'

dependencies:
  flutter:
    sdk: flutter
  stream_video_flutter: ^1.4.1
  stream_video_filters: ^1.4.1
  stream_video_push_notification: ^1.4.1
  uuid: ^4.5.1
  permission_handler: ^12.0.1
  wakelock_plus: ^1.2.0
  app_settings:
    git:
      url: https://github.com/spencerccf/app_settings.git
      ref: master

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  mocktail: ^1.0.4

flutter:
  plugin:
    platforms:
      android:
        package: in.dharmayana.oit_video_call
        pluginClass: OitVideoCallPlugin
      ios:
        pluginClass: OitVideoCallPlugin
